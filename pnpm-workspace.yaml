packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 blocks dependency lifecycle scripts unless they are approved here.
# Entries are scoped to packages this generated stack can pull in.
allowBuilds:
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  workerd: true

overrides:
  lightningcss: 1.30.1
  'markdown-it@10.0.0>linkify-it': 5.0.2

minimumReleaseAgeExclude:
  - '@mhaadi/thinking-orbs-native@0.1.1'
  - '@legendapp/list@3.3.5'
  - '@ai-sdk/gateway@4.0.52'
  - ai@7.0.65
